{% extends 'base.html' %}

{% block content %}

<h2>Create Placement Drive</h2>

<form method="post">

<input type="text" name="title" placeholder="Job Title" class="form-control">

<textarea name="description" placeholder="Job Description" class="form-control mt-2"></textarea>

<input type="text" name="eligibility" placeholder="Eligibility" class="form-control mt-2">

<input type="date" name="deadline" class="form-control mt-2">

<button class="btn btn-success mt-3">Create</button>

</form>

{% endblock %}
