apiVersion: apps/v1
kind: Deployment
metadata:
  name: placement-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: placement-app
  template:
    metadata:
      labels:
        app: placement-app
    spec:
      containers:
      - name: placement-app
        image: placement-app
        imagePullPolicy: Never
        ports:
        - containerPort: 5000